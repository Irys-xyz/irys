disallowed-methods = [
  { path = "alloy_consensus::Signed::recover_signer", reason = "it does not require the low-s form (EIP-2); recover from the tx envelope with SignerRecoverable::recover_signer" },
  { path = "alloy_consensus::Signed::try_into_recovered", reason = "it does not require the low-s form (EIP-2); recover from the tx envelope with SignerRecoverable::try_into_recovered" },
  { path = "bs58::decode", reason = "use irys_types::decode_base58_exact: it caps the input length and requires an exact byte count" },
  { path = "bs58::encode", reason = "use irys_types::ToBase58 so all base58 encoding goes through one place" },
]
