[package]
name = "packing-variant-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false
description = "Standalone CPU/CUDA benchmark comparing two entropy-packing variants"

# Standalone workspace: this project is deliberately NOT a member of the main Irys workspace.
[workspace]

[features]
default = []
# Build and run the CUDA kernels (requires nvcc + CUDA runtime).
cuda = ["dep:irys-packing", "irys-packing/nvidia"]

[dependencies]
clap = { version = "4", features = ["derive"] }
# Same SHA-256 backend (and vendored build) as the reference `irys-c` implementation.
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reference implementation of the current packing algorithm (variant A), used unmodified.
irys-c = { path = "../../crates/c" }
irys-types = { path = "../../crates/types" }
# Production GPU packing (`--mode prod`), built with its CUDA kernel.
irys-packing = { path = "../../crates/packing", optional = true }
eyre = "0.6"

[dev-dependencies]
rand = "0.8"

[build-dependencies]
cc = "1.0"

[profile.release]
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 3
