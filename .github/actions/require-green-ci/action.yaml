name: "Require green CI"
description: >-
  Fails unless a commit has a passing core CI result. The release workflow uses
  this to gate a release on the release/<major>.x merge-base — the substantive
  upstream code being shipped — having passed CI, as defense-in-depth on top of
  branch protection. Core CI is the required correctness lane (Rust Checks and
  any other workflow not listed in non-core-workflows). Non-core workflows
  (Benchmarks and Coverage by default) do not gate: they may be failed,
  cancelled, or still running. A commit is "core-green" when:
    - it has at least one successful core check run (or a green combined commit
      status), proving CI actually ran. A green skip-controller check does not
      count: it proves only that CI decided whether to run; AND
    - no core check run is still running, and none concluded failure / cancelled /
      timed_out / action_required / stale / startup_failure; AND
    - the combined legacy commit status (if any contexts exist) is success.
  A commit with no CI results at all is a hard failure — absence of a run is not
  proof of a passing run. skipped/neutral check runs are treated as non-blocking,
  matching GitHub's own required-status-check semantics. Check runs of the
  calling workflow (this run and its earlier runs on the same commit) are
  ignored: they are not CI, and this run's own jobs never settle while it waits.
  When `branch` is set and that branch has workflow runs on the commit, only
  those runs' check runs are gated on (see the `branch` input).
  Every reported check links its job, failures print the `gh run rerun`
  commands that retry them, and a per-check table is written to the job summary.
  The caller must pass a token with actions:read, checks:read and statuses:read.

inputs:
  commit:
    description: "Full commit SHA to verify CI status for."
    required: true
  github-token:
    description: "Token with actions:read, checks:read and statuses:read on this repo."
    required: true
  wait-timeout-seconds:
    description: >-
      Max seconds to wait for still-running core CI to finish before evaluating.
      0 (the default) preserves the original fail-fast behavior: any core check
      still running is an immediate failure. A positive value polls until every
      core check has settled (or the timeout elapses). A commit that concludes
      with a real core failure/cancellation fails immediately regardless of this
      value — only in-progress core checks are waited on. Non-core workflows are
      never waited on.
    required: false
    default: "0"
  poll-interval-seconds:
    description: "Seconds to sleep between polls while waiting for in-progress CI."
    required: false
    default: "30"
  branch:
    description: >-
      Branch whose CI to gate on (e.g. release/5.x). The same SHA pushed to
      several branches gets one workflow run per push; when this is set and at
      least one core workflow run on the commit was for this branch, check runs
      from workflow runs on other branches are ignored, so a flaky red job on an
      unrelated branch does not block. If no core workflow run on the commit is
      for this branch (e.g. it only got CI as part of a master push), every
      branch's runs are gated on, as when this is empty. Check runs not made by
      GitHub Actions and legacy commit statuses carry no branch and always count.
      Empty (the default) gates on every branch's runs.
    required: false
    default: ""
  non-core-workflows:
    description: >-
      Whitespace- or comma-separated workflow file names (e.g. coverage.yml)
      whose check runs never gate: they are not waited on, their failures are
      ignored, and their successes do not count as proof that CI ran. Matched on
      the workflow file, not job or display names, so renaming a job cannot turn
      a telemetry workflow into a blocking one.
    required: false
    default: "bench.yml coverage.yml"
  report-only:
    description: >-
      "true": evaluate and report exactly as normal, but never fail the step.
      Anything that would block is emitted as a warning prefixed [report-only].
      Used by release dry runs so they show whether the real release would be
      blocked.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Require green CI for commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.commit }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout-seconds }}
        POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
        GATE_BRANCH: ${{ inputs.branch }}
        NON_CORE_WORKFLOWS: ${{ inputs.non-core-workflows }}
        REPORT_ONLY: ${{ inputs.report-only }}
      run: |
        set -euo pipefail

        # In report-only mode every would-block condition is a warning and the
        # step exits 0; otherwise it is an error and the step fails.
        if [ "${REPORT_ONLY}" = "true" ]; then annot=warning; else annot=error; fi

        # Link to GitHub's checks view for this commit so the log has a clickable
        # jump to the live CI runs being gated on.
        CHECKS_URL="${GITHUB_SERVER_URL:-https://github.com}/${REPO}/commit/${SHA}/checks"

        # --- Job summary -------------------------------------------------------
        # Rows describe the most recent poll; the EXIT trap writes them, with the
        # outcome, to the job summary on every exit path (pass, block, timeout,
        # API error), so what blocked is visible without opening the log.
        gate_outcome=""
        summary_rows=""
        rerun_ids=""
        branch_filter=0
        write_summary() {
          local rc=$? outcome
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || return 0
          if [ -n "${gate_outcome}" ]; then
            outcome="${gate_outcome}"
          elif [ "${rc}" -eq 0 ]; then
            outcome="✅ passed"
          else
            outcome="❌ errored before evaluating CI (see the step log)"
          fi
          {
            echo "### Release CI gate"
            echo
            echo "- **Commit:** [\`${SHA:0:12}\`](${CHECKS_URL})"
            if [ "${REPORT_ONLY}" = "true" ]; then
              echo "- **Mode:** report-only (never fails the step)"
            fi
            if [ -z "${GATE_BRANCH}" ]; then
              echo "- **Branch filter:** off (all branches' runs gate)"
            elif [ "${branch_filter}" -eq 1 ]; then
              echo "- **Branch filter:** only runs on \`${GATE_BRANCH}\` gate"
            else
              echo "- **Branch filter:** no core runs on \`${GATE_BRANCH}\` for this commit, so all branches' runs gate"
            fi
            echo "- **Outcome:** ${outcome}"
            if [ -n "${summary_rows}" ]; then
              echo
              echo "| Check | Workflow | Branch | Result | Gate | Job |"
              echo "|---|---|---|---|---|---|"
              printf '%s' "${summary_rows}"
            fi
            if [ -n "${rerun_ids}" ]; then
              echo
              echo "Re-run the failed jobs, then dispatch the release again:"
              echo
              echo '```sh'
              for id in ${rerun_ids}; do
                echo "gh run rerun ${id} --failed -R ${REPO}"
              done
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}" || true
          return 0
        }
        trap write_summary EXIT

        # add_row <name> <workflow> <branch> <result> <gate verdict> <url>
        add_row() {
          local name="${1//|/\\|}"
          summary_rows+="| ${name} | ${2:--} | ${3:--} | ${4:--} | ${5} | ${6:+[job](${6})} |"$'\n'
        }

        # Terminal would-block outcome: fail the step, or in report-only mode warn
        # and pass.
        gate_fail() {
          if [ "${REPORT_ONLY}" = "true" ]; then
            echo "::warning::[report-only] would block release: $1"
            gate_outcome="⚠️ would block the release: $1"
            exit 0
          fi
          echo "::error::$1"
          gate_outcome="❌ blocked: $1"
          exit 1
        }

        if [ -z "${SHA}" ]; then
          gate_fail "require-green-ci: empty commit input"
        fi

        echo "Gating release on CI for ${SHA}"
        echo "  checks: ${CHECKS_URL}"

        # gh has no built-in retry for transient API failures. Under `set -e` a
        # single network blip / 5xx would otherwise abort the whole gate — and the
        # poll loop below makes ~120 calls over a 60-min window, so one such blip
        # anywhere would force a full release re-run. Retry transient failures with
        # backoff. A non-retryable HTTP status (4xx other than 429 and rate-limited
        # 403) is a terminal configuration error — the caller fails fast on it
        # (return 2 → fail_nonretryable_api); an exhausted transient read (return 1)
        # is re-polled in waiting mode, not fatal (see api_error).
        gh_api() {
          local attempt=1 max_attempts=3 out status err_file rate_limited
          err_file=$(mktemp)
          while true; do
            # Buffer the attempt's output and emit only on success, so a failure
            # part-way through pagination is discarded rather than concatenated
            # onto the retry's (re-fetched-from-page-1) output. Capture stderr so a
            # failure can be classified by its HTTP status.
            if out=$(gh api "$@" 2>"${err_file}"); then
              # Re-add the trailing newline `$(...)` strips: gh's `-q @tsv` output is
              # newline-terminated and the downstream `read` relies on that delimiter.
              rm -f "${err_file}"
              printf '%s\n' "${out}"
              return 0
            fi
            # gh reports HTTP errors as "... (HTTP <code>)" on stderr. A 4xx is a
            # terminal config error — bad SHA, missing checks:read/statuses:read
            # scope, 403/404/422 — that neither a retry nor waiting can fix, so signal
            # the caller to fail fast (return 2). The exception is rate limiting, which
            # GitHub returns as 429 *or* 403 (primary and secondary limits): a re-poll
            # clears it, so it is transient like 5xx / network errors (no HTTP code). A
            # rate-limit 403 carries a "rate limit" message; a permission 403 does not.
            status=$(grep -oE '\(HTTP [0-9]{3}\)' "${err_file}" | grep -oE '[0-9]{3}' | tail -n1 || true)
            rate_limited=0
            if grep -qiE 'rate limit' "${err_file}"; then rate_limited=1; fi
            if [ -n "${status}" ] && [ "${status}" -ge 400 ] && [ "${status}" -lt 500 ] \
               && [ "${status}" -ne 429 ] \
               && ! { [ "${status}" -eq 403 ] && [ "${rate_limited}" -eq 1 ]; }; then
              cat "${err_file}" >&2
              rm -f "${err_file}"
              return 2
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              cat "${err_file}" >&2
              rm -f "${err_file}"
              return 1
            fi
            echo "gh api call failed (attempt ${attempt}/${max_attempts}); retrying in $((attempt * 2))s..." >&2
            sleep "$((attempt * 2))"
            attempt=$((attempt + 1))
          done
        }

        # A gh_api read failed with a non-retryable HTTP status (4xx other than
        # rate-limiting): a bad SHA, a repo/permission problem, or a token missing
        # checks:read / statuses:read. Waiting cannot fix a configuration error, so
        # surface it immediately instead of burning the whole wait window first.
        fail_nonretryable_api() {
          gate_fail "GitHub API returned a non-retryable error reading CI status for ${SHA} (e.g. HTTP 404 bad SHA, or a token missing checks:read/statuses:read). Cannot gate the release (${CHECKS_URL}). (Emergency hotfixes can bypass with force=true.)"
        }

        # Benchmarks and Coverage are telemetry, not a release correctness gate. A
        # pending or failed run of a non-core workflow must not block release and
        # must not count as the required successful CI result. Matched on the
        # workflow file (path basename) of the check run's workflow run, so job
        # renames inside those workflows cannot make them blocking.
        read -ra non_core_workflows <<< "$(tr ',\n' '  ' <<< "${NON_CORE_WORKFLOWS}")"
        is_non_core_workflow() {
          local base="${1##*/}" w
          [ -n "$1" ] || return 1
          for w in "${non_core_workflows[@]}"; do
            [ "${base}" = "${w##*/}" ] && return 0
          done
          return 1
        }

        # The core Rust lane's `gate` job only decides whether the real checks
        # run. It is core — a failed or in-progress gate means the checks it
        # controls did not report, so it must block — but its own success proves
        # nothing about the code, so it cannot be the result that proves CI ran.
        # Otherwise a commit whose gate short-circuits every real check (e.g.
        # #disable-ci) would release on the gate's green alone.
        is_skip_controller_check() {
          case "$1" in
            gate) return 0 ;;
          esac
          return 1
        }

        # Remember a failing check's workflow run so the gate can print the exact
        # `gh run rerun` command for it.
        note_rerun() {
          [ -n "$1" ] || return 0
          case " ${rerun_ids} " in
            *" $1 "*) ;;
            *) rerun_ids="${rerun_ids:+${rerun_ids} }$1" ;;
          esac
        }

        # The calling workflow's own check runs are on SHA when it was dispatched
        # from a ref whose head is SHA (e.g. a release dispatched from master
        # right after the release branch is cut). Its own in-progress jobs would
        # make the gate wait on itself until timeout, and a cancelled earlier run
        # of it would fail the gate. Identify the workflow here, then on each
        # poll skip every check run in a check suite of that workflow's runs.
        if own_workflow_id=$(gh_api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}" -q '.workflow_id'); then
          :
        else
          rc=$?
          if [ "${rc}" -eq 2 ]; then fail_nonretryable_api; fi
          gate_fail "Could not read the workflow of run ${GITHUB_RUN_ID} from the GitHub API after retries."
        fi

        # check suite id -> workflow file path / head branch / workflow run id, and
        # the set of this workflow's own suites. Refreshed on every poll.
        declare -A suite_path=() suite_branch=() suite_run=() own_suite=()
        prev_branch_filter=""

        # SECONDS is bash's monotonic elapsed-seconds counter since shell start;
        # the poll loop below waits until SECONDS exceeds this deadline.
        deadline=$((SECONDS + WAIT_TIMEOUT))

        while true; do
          api_error=0    # a read failed after its retries (transient API error)
          summary_rows=""
          rerun_ids=""

          # GitHub Actions jobs surface as "check runs"; external CI / bots surface
          # as legacy "commit statuses". A passing core CI result must satisfy both.
          # filter=latest (the API default) collapses re-runs to the most recent run
          # per check name *within a check suite* (one workflow run), so a red job
          # that was later re-run green is not counted. It does not collapse across
          # suites: when the same SHA is pushed to several branches, each push's
          # workflow run is its own suite (see the branch filter below).
          # The URL is the job page for Actions checks (details_url), falling back to
          # the check run page (html_url, always set) for external check apps, so a
          # blocking check can be opened straight from the gate's log.
          # Only the last field may be empty: `read` with IFS=tab merges adjacent
          # tabs, so an empty field before it would shift the later fields left.
          runs_tsv=""
          if runs_tsv=$(gh_api --paginate \
            "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
            -q '.check_runs[] | [.check_suite.id, .name, .status, (.details_url // .html_url), (.conclusion // "")] | @tsv'); then
            :
          else
            rc=$?
            runs_tsv=""
            if [ "${rc}" -eq 2 ]; then fail_nonretryable_api; fi
            api_error=1
          fi

          # Workflow runs on SHA, read *after* the check runs so every check run's
          # suite is already listed. Maps each suite to its workflow file, branch
          # and run, and identifies this workflow's own suites (a run of it queued
          # after the gate started also adds check runs to SHA). Without this map,
          # own/non-core/other-branch check runs cannot be told apart, so do not
          # evaluate check runs on this poll (api_error re-polls).
          wf_tsv=""
          if [ "${api_error}" -eq 0 ]; then
            if wf_tsv=$(gh_api --paginate \
              "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
              -q '.workflow_runs[] | [.check_suite_id, .workflow_id, .id, .path, (.head_branch // "")] | @tsv'); then
              :
            else
              rc=$?
              wf_tsv=""
              runs_tsv=""
              if [ "${rc}" -eq 2 ]; then fail_nonretryable_api; fi
              api_error=1
            fi
          fi

          suite_path=() suite_branch=() suite_run=() own_suite=()
          gated_branch_suites=0
          if [ -n "${wf_tsv}" ]; then
            while IFS=$'\t' read -r s_id wf_id run_id path head_branch; do
              [ -z "${s_id}" ] && continue
              if [ "${wf_id}" = "${own_workflow_id}" ]; then
                own_suite[${s_id}]=1
                continue
              fi
              suite_path[${s_id}]="${path}"
              suite_branch[${s_id}]="${head_branch}"
              suite_run[${s_id}]="${run_id}"
              if [ -n "${GATE_BRANCH}" ] && [ "${head_branch}" = "${GATE_BRANCH}" ] \
                 && ! is_non_core_workflow "${path}"; then
                gated_branch_suites=$((gated_branch_suites + 1))
              fi
            done <<< "${wf_tsv}"
          fi

          # Branch filter: gate only on the gated branch's own workflow runs when it
          # has any core ones on SHA. Otherwise (it never got its own run, e.g. the
          # commit only reached CI via a master push) fall back to every branch, so
          # the gate never passes on an absence of results.
          if [ "${api_error}" -eq 0 ]; then
            if [ -n "${GATE_BRANCH}" ] && [ "${gated_branch_suites}" -gt 0 ]; then
              branch_filter=1
            else
              branch_filter=0
            fi
            if [ -n "${GATE_BRANCH}" ] && [ "${branch_filter}" != "${prev_branch_filter}" ]; then
              if [ "${branch_filter}" -eq 1 ]; then
                echo "Gating only on workflow runs for branch ${GATE_BRANCH}; check runs from other branches' runs of ${SHA} are ignored."
              else
                echo "No core workflow run for branch ${GATE_BRANCH} on ${SHA} (yet); gating on every branch's runs."
              fi
              prev_branch_filter="${branch_filter}"
            fi
          fi

          fail=0          # a check reached a real, terminal non-pass conclusion
          pending=0       # a check is still running (waitable)
          no_results=0    # no checks/statuses registered yet (also waitable)
          pending_names=""
          successes=0
          check_successes=0
          total_runs=0
          if [ -n "${runs_tsv}" ]; then
            while IFS=$'\t' read -r suite_id name status url conclusion; do
              [ -z "${name}" ] && continue
              if [ -n "${own_suite[${suite_id}]:-}" ]; then
                continue
              fi
              # Empty path: not a GitHub Actions check (an external check app), so
              # it has no workflow or branch and is always core.
              path="${suite_path[${suite_id}]:-}"
              head_branch="${suite_branch[${suite_id}]:-}"
              workflow="${path##*/}"
              [ -n "${path}" ] || workflow="(external)"
              where="${workflow}${head_branch:+ @ ${head_branch}}"
              result="${status}"
              [ "${status}" = "completed" ] && result="${conclusion}"

              if is_non_core_workflow "${path}"; then
                if [ "${status}" = "completed" ]; then
                  case "${conclusion}" in
                    success|skipped|neutral) ;;
                    *)
                      echo "Ignoring non-core check '${name}' (${where}, conclusion=${conclusion}) on ${SHA}: ${url}"
                      ;;
                  esac
                fi
                add_row "${name}" "${workflow}" "${head_branch}" "${result}" "ignored (non-core)" "${url}"
                continue
              fi
              if [ "${branch_filter}" -eq 1 ] && [ -n "${path}" ] && [ "${head_branch}" != "${GATE_BRANCH}" ]; then
                if [ "${status}" = "completed" ]; then
                  case "${conclusion}" in
                    success|skipped|neutral) ;;
                    *)
                      echo "Ignoring check '${name}' from another branch (${where}, conclusion=${conclusion}) on ${SHA}: ${url}"
                      ;;
                  esac
                fi
                add_row "${name}" "${workflow}" "${head_branch}" "${result}" "ignored (other branch)" "${url}"
                continue
              fi

              # A skip controller still blocks, but is not counted as one of the
              # core results that prove CI ran.
              qualifying=1
              if is_skip_controller_check "${name}"; then
                qualifying=0
              else
                total_runs=$((total_runs + 1))
              fi
              if [ "${status}" != "completed" ]; then
                echo "Check '${name}' (${where}) is still running (status=${status}) on ${SHA}: ${url}"
                pending=$((pending + 1))
                pending_names="${pending_names:+${pending_names}, }${name} [${where}] ${url}"
                add_row "${name}" "${workflow}" "${head_branch}" "${result}" "⏳ waiting" "${url}"
                continue
              fi
              case "${conclusion}" in
                success)
                  if [ "${qualifying}" -eq 1 ]; then
                    successes=$((successes + 1))
                    check_successes=$((check_successes + 1))
                    add_row "${name}" "${workflow}" "${head_branch}" "${result}" "✅ pass" "${url}"
                  else
                    add_row "${name}" "${workflow}" "${head_branch}" "${result}" "✅ pass (skip controller; not proof CI ran)" "${url}"
                  fi
                  ;;
                skipped|neutral)
                  # Non-blocking, mirrors GitHub's required-status-check semantics.
                  add_row "${name}" "${workflow}" "${head_branch}" "${result}" "non-blocking" "${url}"
                  ;;
                *)
                  echo "::${annot}::Check '${name}' (${where}) did not pass (conclusion=${conclusion}) on ${SHA}: ${url}"
                  add_row "${name}" "${workflow}" "${head_branch}" "${result}" "❌ **blocking**" "${url}"
                  note_rerun "${suite_run[${suite_id}]:-}"
                  fail=1
                  ;;
              esac
            done <<< "${runs_tsv}"
          fi

          # Combined legacy status: the .state field is aggregated server-side across
          # every context, so one read is authoritative regardless of context count.
          # One call returns the aggregate (first line) and every non-success
          # context with its link (later lines) via gh's embedded jq, so no system
          # jq dependency; splitting it into several `gh api` calls would risk
          # reading an inconsistent state/total across a status update mid-poll.
          status_state=""
          status_total=0
          bad_statuses=""
          if status_out=$(gh_api "repos/${REPO}/commits/${SHA}/status?per_page=100" \
            -q '([.state, .total_count] | @tsv), (.statuses[] | select(.state != "success") | [.context, .state, (.target_url // "")] | @tsv)'); then
            IFS=$'\t' read -r status_state status_total <<< "$(head -n1 <<< "${status_out}")"
            bad_statuses=$(tail -n +2 <<< "${status_out}")
          else
            rc=$?
            if [ "${rc}" -eq 2 ]; then fail_nonretryable_api; fi
            api_error=1
          fi

          if [ "${status_total}" -gt 0 ]; then
            case "${status_state}" in
              success)
                successes=$((successes + 1))
                add_row "combined commit status (${status_total} context(s))" "(status)" "" "success" "✅ pass" ""
                ;;
              pending)
                echo "Combined commit status for ${SHA} is still pending."
                pending=$((pending + 1))
                ;;
              *)
                echo "::${annot}::Combined commit status for ${SHA} is '${status_state}' (expected success)."
                fail=1
                ;;
            esac
            # Name each non-success context, with its link, so a red or pending
            # combined status says which status is responsible.
            if [ -n "${bad_statuses}" ]; then
              while IFS=$'\t' read -r context state target_url; do
                [ -z "${context}" ] && continue
                if [ "${state}" = "pending" ]; then
                  echo "Commit status '${context}' is still pending on ${SHA}${target_url:+: ${target_url}}"
                  pending_names="${pending_names:+${pending_names}, }status ${context}${target_url:+ ${target_url}}"
                  add_row "${context}" "(status)" "" "${state}" "⏳ waiting" "${target_url}"
                else
                  echo "::${annot}::Commit status '${context}' is '${state}' on ${SHA}${target_url:+: ${target_url}}"
                  add_row "${context}" "(status)" "" "${state}" "❌ **blocking**" "${target_url}"
                fi
              done <<< "${bad_statuses}"
            fi
          fi

          # A real failure is terminal — waiting cannot turn it green, so fail fast
          # even if other checks are still in flight, or if an unrelated status read
          # hit a transient API error this same poll: a check that already concluded
          # red is proven red regardless of the other endpoint. Checked before the
          # api_error branch so a known failure is never deferred behind a read blip.
          if [ "${fail}" -ne 0 ]; then
            if [ -n "${rerun_ids}" ]; then
              echo "Re-run the failed jobs, then dispatch the release again:"
              for id in ${rerun_ids}; do
                echo "  gh run rerun ${id} --failed -R ${REPO}"
              done
            fi
            gate_fail "Core CI for ${SHA} is not green; refusing to release (${CHECKS_URL}). (Emergency hotfixes can bypass with force=true.)"
          fi

          # A read failed after exhausting its retries on a transient error (5xx /
          # rate-limit / network — a non-retryable 4xx already exited above via
          # fail_nonretryable_api). We could not observe CI state this poll and no
          # observed check has failed; that is not a CI failure. In waiting mode, treat
          # it like a pending check and re-poll until the deadline rather than aborting
          # the release over an API outage. With WAIT_TIMEOUT=0 the deadline is already
          # past, so a persistent outage still fails fast and closed.
          if [ "${api_error}" -ne 0 ]; then
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              gate_fail "Could not read CI status for ${SHA} from the GitHub API after retries (transient error, e.g. 5xx). Cannot prove the release base passed CI (${CHECKS_URL}). (Emergency hotfixes can bypass with force=true.)"
            fi
            echo "GitHub API read failed (likely transient); waiting ${POLL_INTERVAL}s before retry (elapsed ${SECONDS}s / timeout ${WAIT_TIMEOUT}s) — ${CHECKS_URL}"
            sleep "${POLL_INTERVAL}"
            continue
          fi

          # No checks/statuses observed yet. When waiting is enabled this is likely a
          # race — the release was dispatched just as the merge-base landed, before CI
          # registered — so treat it as waitable and let later polls see them appear.
          # With WAIT_TIMEOUT=0 the deadline is already past, so the pending branch
          # below still fails fast on the first poll, preserving the original behavior.
          if [ "${total_runs}" -eq 0 ] && [ "${status_total}" -eq 0 ] && [ "${pending}" -eq 0 ]; then
            echo "No core CI check runs or commit statuses found yet for ${SHA}."
            no_results=1
            pending=$((pending + 1))
          fi

          # No failures, but something is still settling (in-progress checks, a
          # pending combined status, or checks not registered yet). Wait and re-poll
          # until the deadline, then give up. With WAIT_TIMEOUT=0 the deadline is
          # already past so this is the original fail-fast behavior.
          if [ "${pending}" -ne 0 ]; then
            if [ "${no_results}" -ne 0 ]; then
              waiting_for="core CI to register on ${SHA}"
            else
              waiting_for="${pending} in-progress CI check(s) on ${SHA} to finish (${pending_names:-combined commit status})"
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              if [ "${no_results}" -ne 0 ]; then
                gate_fail "Timed out after ${WAIT_TIMEOUT}s: no core CI check runs or commit statuses ever appeared for ${SHA}. Cannot prove the release base passed CI (${CHECKS_URL}). (Emergency hotfixes can bypass with force=true.)"
              else
                gate_fail "Timed out after ${WAIT_TIMEOUT}s waiting for ${waiting_for} (${CHECKS_URL}). (Emergency hotfixes can bypass with force=true.)"
              fi
            fi
            echo "Waiting ${POLL_INTERVAL}s for ${waiting_for} (elapsed ${SECONDS}s / timeout ${WAIT_TIMEOUT}s) — ${CHECKS_URL}"
            sleep "${POLL_INTERVAL}"
            continue
          fi

          # Settled with no failures and nothing pending — exit the poll loop.
          break
        done

        # Every check was skipped/neutral and no green status exists: CI never
        # actually ran (e.g. a #disable-ci gate short-circuit), so there is no
        # passing run to stand behind.
        if [ "${successes}" -eq 0 ]; then
          gate_fail "No successful core CI result for ${SHA} (all core checks skipped/neutral, no green status). Cannot prove a real CI run passed (${CHECKS_URL}). (Emergency hotfixes can bypass with force=true.)"
        fi

        if [ "${status_total}" -gt 0 ]; then
          status_summary="combined commit status: ${status_state}"
        else
          status_summary="no commit statuses"
        fi
        echo "Core CI for ${SHA} is green (${check_successes} of ${total_runs} core check run(s) successful; ${status_summary})."
        gate_outcome="✅ passed: ${check_successes} of ${total_runs} core check run(s) successful; ${status_summary}"
