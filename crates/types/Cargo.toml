[package]
edition.workspace = true
name = "irys-types"
version = "0.1.0"

[features]
default = ["db"]
test-utils = []
# MDBX Compact/Encode, chainspec, and EVM gossip types. On by default so the
# node workspace is unchanged. Gateway (and any other git consumer that only
# needs DataTransaction / IrysSigner / chunks) should set
# `default-features = false` to skip reth-db, mdbx-sys, and reth-codecs.
db = [
  "dep:reth-chainspec",
  "dep:reth-db",
  "dep:reth-db-api",
  "dep:reth-tasks",
]

[dependencies]
semver.workspace = true
uint = "0.9.5"
base58 = "0.2.0"
base64-url.workspace = true
derive_more = { version = "2.0.1", features = [
    "add",
    "mul",
    "from",
    "into",
], default-features = true }
eyre = "0.6.8"
ruint.workspace = true
fixed-hash = "0.8.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
borsh = "1.3.0"
borsh-derive = "1.3.0"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
tokio = { workspace = true, features = ["time", "sync"] }
sha2.workspace = true
tracing.workspace = true
arbitrary.workspace = true
nodit.workspace = true
bytes.workspace = true
modular-bitfield.workspace = true
alloy-rlp.workspace = true
zerocopy = "0.8.9"
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
bytemuck.workspace = true
hex.workspace = true
toml.workspace = true
alloy-primitives = { workspace = true, features = ["k256"] }
# Compact lives in reth-codecs (small). The `db` feature adds MDBX Encode/Decode
# (reth-db / mdbx-sys) plus chainspec and task shutdown — skip that in gateway.
reth-codecs.workspace = true
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-chainspec = { workspace = true, optional = true }
alloy-eips.workspace = true
alloy-genesis.workspace = true
reth-db = { workspace = true, optional = true }
reth-db-api = { workspace = true, optional = true }
reth-tasks = { workspace = true, optional = true }
alloy-signer.workspace = true
alloy-core.workspace = true
alloy-signer-local.workspace = true
futures.workspace = true
thiserror.workspace = true
async-trait.workspace = true
irys-macros-integer-tagged.workspace = true
proptest.workspace = true
chrono.workspace = true

[dev-dependencies]
test-fuzz.workspace = true
rstest.workspace = true
pretty_assertions.workspace = true
assert_matches.workspace = true

[build-dependencies]
build-print = "0"

[lints]
workspace = true
