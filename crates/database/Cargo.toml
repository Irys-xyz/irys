[package]
name = "irys-database"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
test-utils = []
# Native engine for the submodule index. Any crate that depends on
# `irys-domain` turns this on (`irys-domain` enables it), so the node binary
# links RocksDB. An `irys-database`-only build leaves it off. The converter
# and bench bins built from this crate alone need `--features rocksdb`.
# `cargo xtask check` turns it on via `--all-features`.
rocksdb = ["dep:rocksdb"]

[dependencies]
rayon.workspace = true
alloy-primitives.workspace = true
irys-config.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
bytes.workspace = true
modular-bitfield.workspace = true
eyre.workspace = true
irys-types.workspace = true
irys-utils.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
irys-testing-utils.workspace = true
test-fuzz.workspace = true
metrics.workspace = true
reth-db.workspace = true
reth-db-api.workspace = true
reth-codecs.workspace = true
reth-primitives-traits.workspace = true
paste.workspace = true
strum.workspace = true
# Same 0.24 line reth pins. Default features include lz4 and leave jemalloc off.
rocksdb = { version = "0.24.0", optional = true }
libc = "0.2"

[[bin]]
# MDBX-SUBMODULE-INDEX: delete the MDBX engine path of this bench. The RocksDB timings can stay.
name = "submodule-index-bench"
path = "src/bin/submodule_index_bench.rs"
required-features = ["rocksdb"]

[[bin]]
# MDBX-SUBMODULE-INDEX: remove this bin with the v1 to v2 MDBX migration.
name = "submodule-index-migrate"
path = "src/bin/submodule_index_migrate.rs"

[[bin]]
# MDBX-SUBMODULE-INDEX: remove this bin once the rollback window is closed.
name = "submodule-index-convert"
path = "src/bin/submodule_index_convert.rs"
required-features = ["rocksdb"]

[[bin]]
name = "tx-path-derive-bench"
path = "src/bin/tx_path_derive_bench.rs"

[dev-dependencies]
irys-config = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
test-log.workspace = true
rand.workspace = true
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
