[package]
name = "irys-database"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
test-utils = []
# Opt-in native engine for the submodule index. Off in the node build.
# `cargo xtask check` turns it on via `--all-features`.
rocksdb = ["dep:rocksdb"]

[dependencies]
alloy-primitives.workspace = true
irys-config.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
bytes.workspace = true
modular-bitfield.workspace = true
eyre.workspace = true
irys-types.workspace = true
irys-utils.workspace = true
tracing.workspace = true
irys-testing-utils.workspace = true
test-fuzz.workspace = true
metrics.workspace = true
reth-db.workspace = true
reth-db-api.workspace = true
reth-codecs.workspace = true
reth-primitives-traits.workspace = true
paste.workspace = true
strum.workspace = true
# Same 0.24 line reth pins. Default features include lz4 and leave jemalloc off.
rocksdb = { version = "0.24.0", optional = true }

[[bin]]
name = "submodule-index-bench"
path = "src/bin/submodule_index_bench.rs"
required-features = ["rocksdb"]

[dev-dependencies]
irys-config = { workspace = true, features = ["test-utils"] }
test-log.workspace = true
rand.workspace = true
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
