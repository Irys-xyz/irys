[package]
name = "irys-vdf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes narrow test mutation handles (`VdfStateReadonly::test_set_step`,
# `ReanchorSignals::test_record_heal_applied`) for downstream crates' tests
# (e.g. irys-p2p, irys-actors). Production code must never enable this.
test-utils = []

[dependencies]
irys-types.workspace = true
irys-efficient-sampling.workspace = true
irys-domain.workspace = true
irys-utils.workspace = true
opentelemetry.workspace = true
sha2.workspace = true
rayon.workspace = true
tokio.workspace = true
tokio-util.workspace = true
eyre.workspace = true
tracing.workspace = true
openssl.workspace = true
hex.workspace = true
nodit.workspace = true
thiserror.workspace = true

# sha2 only uses the ARMv8 SHA-256 instructions behind its `asm` feature;
# without it aarch64 falls back to software SHA-256, several times slower
# than the VDF startup check allows. Scoped to aarch64 because sha2-asm
# refuses to build for Windows targets and x86 already gets SHA-NI.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
irys-types = { workspace = true, features = ["test-utils"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
criterion.workspace = true
proptest.workspace = true
rstest.workspace = true
test-log.workspace = true

[[bench]]
name = "vdf_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["opentelemetry"]

[lints]
workspace = true
